<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/projects.js"></script>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="name" href="../">Joseph Jeon</a>
      <ul>
        <li><a href="../">Home</a></li>
        <li><a href="../projects/">Projects</a></li>
        <li><a href="./">Blog</a></li>
      </ul>
    </nav>

    <header class="hero">
      <h1>Blog</h1>
      <p>Notes, experiments and runnable code.</p>
    </header>

    <section>
      <div id="posts"><p class="muted">Loading…</p></div>
    </section>

    <footer>© 2026 Joseph Jeon</footer>
  </div>

  <script>
    Projects.load().then(function (data) {
      var box = document.getElementById("posts");
      box.innerHTML = "";
      if (!data.posts.length) { box.innerHTML = '<p class="muted">No posts yet.</p>'; return; }
      Projects.renderPostList(box, data.posts, data.projects);
    }).catch(function () {
      document.getElementById("posts").innerHTML = '<p class="muted">Couldn\'t load posts.</p>';
    });
  </script>
</body>
</html>
