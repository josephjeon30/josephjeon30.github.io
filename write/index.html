<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Post Editor</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
  <script src="../js/pycells.js"></script>
  <script src="../js/blog.js"></script>
</head>
<body>
  <div class="wrap wide">
    <nav>
      <a class="name" href="../">Joseph Jeon</a>
      <ul>
        <li><a href="../blog/">Blog</a></li>
        <li><a href="manage/">Manage posts</a></li>
        <li><button class="link-btn" id="lock" hidden>Lock</button></li>
      </ul>
    </nav>

    <div id="auth" hidden></div>

    <!-- Editor -->
    <section id="app" class="editor" hidden>
      <div class="editor-top">
        <label class="grow">Post
          <select id="existing"><option value="">+ New post</option></select>
        </label>
        <span class="muted small" id="draft-msg"></span>
      </div>
      <label>Title <input type="text" id="title" placeholder="My new post"></label>
      <label>Summary <span class="muted small">(optional, shown on the blog list)</span>
        <input type="text" id="summary"></label>
      <div class="muted small" id="slug-line"></div>

      <div class="editor-grid">
        <div>
          <div class="toolbar">
            <button class="py-run" id="insert-cell" type="button">+ Python cell</button>
            <button class="py-run" id="insert-image" type="button">+ Image</button>
            <input type="file" id="image-input" accept="image/*" multiple hidden>
            <span class="muted small">Markdown. <code>```python</code> blocks become runnable cells. Paste or drop images.</span>
          </div>
          <textarea id="body" spellcheck="true" placeholder="Write in Markdown…"></textarea>
        </div>
        <div>
          <div class="toolbar">
            <strong class="small">Preview</strong>
            <button class="py-run" id="py-run-all" type="button">Run all</button>
            <span id="py-status" class="small"></span>
          </div>
          <div class="preview post-body" id="preview"></div>
        </div>
      </div>

      <div class="publish-bar">
        <button class="run-btn" id="publish">Publish</button>
        <span class="form-msg" id="publish-msg"></span>
      </div>
    </section>
  </div>

  <script src="../js/admin.js"></script>
  <script src="../js/editor.js"></script>
</body>
</html>
